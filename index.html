<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="top-bar">
    <select id="skin-select" aria-label="Apariencia de las piezas" title="Apariencia de las piezas">
      <option value="retro">Retro</option>
      <option value="neon">Neón</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
    <button id="theme-toggle" type="button" role="switch" aria-checked="false">Modo claro</button>
  </div>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul id="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>
        <div id="pause-menu" class="pause-menu" hidden>
          <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
          <button id="menu-restart-btn" class="menu-btn secondary" type="button">Reiniciar</button>
          <button id="controls-btn" class="menu-btn secondary" type="button" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
          <ul id="pause-controls" class="pause-controls" hidden></ul>
          <label class="start-level">
            <span>Nivel inicial</span>
            <select id="start-level">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </label>
          <p class="start-level-hint">Se aplica en la próxima partida</p>
        </div>
        <p id="record-new" hidden>¡Nuevo récord!</p>
        <form id="record-form" hidden>
          <input id="record-name" type="text" value="Jugador" autocomplete="off" aria-label="Tu nombre" />
          <button type="submit">Guardar</button>
        </form>
        <div id="records">
          <span class="label">RÉCORDS</span>
          <table>
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-stats"></p>
        </div>
        <button id="restart-btn" class="menu-btn" type="button">Jugar</button>
        <button id="reset-records-btn" type="button">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
